<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Fertility Dashboard — Bangalore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f0f13;
  --surface: #1a1a24;
  --surface2: #24243a;
  --border: #2a2a44;
  --text: #e8e8f0;
  --text2: #9090b0;
  --accent: #7c3aed;
  --accent2: #a78bfa;
  --green: #22c55e;
  --yellow: #eab308;
  --red: #ef4444;
  --radius: 12px;
  --shadow: 0 8px 32px rgba(0,0,0,0.5);
  --font: 'Inter', system-ui, -apple-system, sans-serif;
}
html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); overflow: hidden; }
#map {
  position: fixed; inset: 0;
  z-index: 0;
}
.leaflet-container { background: #0a0a10 !important; }
.leaflet-control-zoom a { background: var(--surface) !important; color: var(--text) !important; border-color: var(--border) !important; }
.leaflet-control-attribution { background: var(--surface) !important; color: var(--text2) !important; }
.leaflet-control-attribution a { color: var(--accent2) !important; }
.marker-cluster-small { background-color: rgba(124,58,237,0.3) !important; }
.marker-cluster-small div { background-color: rgba(124,58,237,0.6) !important; color: #fff !important; }
.marker-cluster-medium { background-color: rgba(168,85,247,0.3) !important; }
.marker-cluster-medium div { background-color: rgba(168,85,247,0.6) !important; color: #fff !important; }
.marker-cluster-large { background-color: rgba(192,38,211,0.3) !important; }
.marker-cluster-large div { background-color: rgba(192,38,211,0.6) !important; color: #fff !important; }

/* Header overlay */
#header {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  z-index: 1000;
  background: rgba(26,26,36,0.92);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 12px 24px;
  display: flex; align-items: center; gap: 20px;
  box-shadow: var(--shadow);
}
#header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
#header h1 span { color: var(--accent2); }
#header .subtitle { font-size: 12px; color: var(--text2); }

/* Legend */
#legend {
  position: fixed; bottom: 32px; right: 20px;
  z-index: 1000;
  background: rgba(26,26,36,0.92);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 18px;
  box-shadow: var(--shadow);
}
#legend h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text2); margin-bottom: 8px; }
#legend .item { display: flex; align-items: center; gap: 10px; margin: 5px 0; font-size: 13px; cursor: pointer; padding: 3px 6px; border-radius: 6px; transition: 0.2s; }
#legend .item:hover { background: var(--surface2); }
#legend .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.15); flex-shrink: 0; }
#legend .count { font-size: 11px; color: var(--text2); margin-left: auto; }

/* Stats bar */
#stats {
  position: fixed; bottom: 32px; left: 20px;
  z-index: 1000;
  display: flex; gap: 10px;
}
.stat-card {
  background: rgba(26,26,36,0.92);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 18px;
  box-shadow: var(--shadow);
  text-align: center;
  min-width: 90px;
}
.stat-card .num { font-size: 20px; font-weight: 700; }
.stat-card .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text2); margin-top: 2px; }

/* Side panel */
#panel {
  position: fixed; top: 0; right: -480px; width: 480px; height: 100%;
  z-index: 2000;
  background: rgba(18,18,28,0.97);
  backdrop-filter: blur(24px);
  border-left: 1px solid var(--border);
  box-shadow: -8px 0 40px rgba(0,0,0,0.6);
  transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex; flex-direction: column;
  overflow: hidden;
}
#panel.open { right: 0; }
#panel-backdrop {
  position: fixed; inset: 0; z-index: 1999;
  background: rgba(0,0,0,0.5);
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
}
#panel-backdrop.show { opacity: 1; pointer-events: auto; }

#panel-header {
  padding: 24px 28px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between;
  flex-shrink: 0;
}
#panel-header .info h2 { font-size: 16px; font-weight: 600; }
#panel-header .info .coords { font-size: 12px; color: var(--text2); margin-top: 2px; font-family: monospace; }
#panel-close {
  width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; transition: 0.2s; flex-shrink: 0;
}
#panel-close:hover { background: var(--surface2); }

#panel-body {
  flex: 1; overflow-y: auto; padding: 20px 28px 28px;
}
#panel-body::-webkit-scrollbar { width: 4px; }
#panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.score-row {
  display: flex; gap: 12px; margin-bottom: 20px;
}
.score-card {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
}
.score-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text2); }
.score-card .value { font-size: 28px; font-weight: 800; margin: 6px 0 2px; }
.score-card .badge {
  display: inline-block;
  font-size: 11px; font-weight: 600; padding: 2px 10px; border-radius: 20px;
  text-transform: uppercase; letter-spacing: 0.3px;
}
.badge-high { background: rgba(34,197,94,0.15); color: var(--green); }
.badge-medium { background: rgba(234,179,8,0.15); color: var(--yellow); }
.badge-low { background: rgba(239,68,68,0.15); color: var(--red); }

/* Model selector */
.model-tabs {
  display: flex; gap: 6px; margin-bottom: 16px;
  background: var(--surface); border-radius: 10px; padding: 4px;
}
.model-tab {
  flex: 1; text-align: center; padding: 8px 6px; border-radius: 8px;
  font-size: 11px; font-weight: 600; cursor: pointer;
  transition: 0.2s; border: none; color: var(--text2); background: transparent;
}
.model-tab.active { background: var(--accent); color: #fff; box-shadow: 0 2px 12px rgba(124,58,237,0.3); }
.model-tab:hover:not(.active) { color: var(--text); background: var(--surface2); }

.chart-container { position: relative; height: 260px; margin-bottom: 8px; }

/* Prediction value on chart area */
.pred-summary {
  display: flex; gap: 12px; margin-top: 0;
}
.pred-stat {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  text-align: center;
}
.pred-stat .label { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.3px; }
.pred-stat .value { font-size: 16px; font-weight: 700; margin-top: 2px; }
.pred-stat .change { font-size: 12px; font-weight: 600; margin-top: 1px; }
.change-up { color: var(--green); }
.change-down { color: var(--red); }
.change-flat { color: var(--yellow); }

/* Mobile */
@media (max-width: 640px) {
  #header { top: 10px; padding: 10px 16px; flex-wrap: wrap; gap: 4px; max-width: calc(100% - 20px); }
  #header h1 { font-size: 15px; }
  #panel { width: 100%; right: -100%; }
  #legend { bottom: 16px; right: 10px; padding: 10px 14px; }
  #stats { bottom: 16px; left: 10px; flex-wrap: wrap; gap: 6px; }
  .stat-card { min-width: 60px; padding: 8px 12px; }
  .stat-card .num { font-size: 16px; }
  #panel-body { padding: 16px; }
  #panel-header { padding: 16px; }
}
</style>
</head>
<body>

<div id="map"></div>

<div id="header">
  <h1><span>Fertility</span>Scope</h1>
  <span class="subtitle">Bangalore · Soil Intelligence</span>
</div>

<div id="legend">
  <h3>Fertility</h3>
  <div class="item" data-class="High"><span class="dot" style="background:var(--green)"></span> Optimal <span class="count" id="count-high"></span></div>
  <div class="item" data-class="Medium"><span class="dot" style="background:var(--yellow)"></span> Moderate <span class="count" id="count-med"></span></div>
  <div class="item" data-class="Low"><span class="dot" style="background:var(--red)"></span> Low <span class="count" id="count-low"></span></div>
</div>

<div id="stats">
  <div class="stat-card"><div class="num" id="stat-sites">0</div><div class="label">Sites</div></div>
  <div class="stat-card"><div class="num" id="stat-optimal" style="color:var(--green)">0</div><div class="label">Optimal</div></div>
  <div class="stat-card"><div class="num" id="stat-moderate" style="color:var(--yellow)">0</div><div class="label">Moderate</div></div>
  <div class="stat-card"><div class="num" id="stat-low" style="color:var(--red)">0</div><div class="label">Low</div></div>
</div>

<div id="panel-backdrop"></div>
<div id="panel">
  <div id="panel-header">
    <div class="info">
      <h2 id="panel-title">Site Details</h2>
      <div class="coords" id="panel-coords"></div>
    </div>
    <button id="panel-close">&times;</button>
  </div>
  <div id="panel-body">
    <div class="score-row">
      <div class="score-card">
        <div class="label">Current</div>
        <div class="value" id="panel-current-val">—</div>
        <div><span class="badge" id="panel-current-badge"></span></div>
      </div>
      <div class="score-card">
        <div class="label">Predicted (6mo)</div>
        <div class="value" id="panel-predicted-val">—</div>
        <div><span class="badge" id="panel-predicted-badge"></span></div>
      </div>
    </div>

    <div class="model-tabs" id="model-tabs">
      <!-- Tabs will be injected here dynamically -->
    </div>

    <div class="chart-container">
      <canvas id="trend-chart"></canvas>
    </div>

    <div class="pred-summary">
      <div class="pred-stat">
        <div class="label">Current</div>
        <div class="value" id="ps-current">—</div>
      </div>
      <div class="pred-stat">
        <div class="label">Predicted</div>
        <div class="value" id="ps-predicted">—</div>
      </div>
      <div class="pred-stat">
        <div class="label">Trend</div>
        <div class="value" id="ps-trend">—</div>
      </div>
    </div>
  </div>
</div>

<script>
const CLASS_ORDER = {"Low": 0, "Medium": 1, "High": 2};
const CLASS_COLORS = {"Low": "#ef4444", "Medium": "#eab308", "High": "#22c55e"};
let MODELS = [];

const map = L.map("map", {
  center: [12.97, 77.59],
  zoom: 11,
  zoomControl: true,
  attributionControl: true,
});

L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: "abcd",
  maxZoom: 19,
  minZoom: 4,
}).addTo(map);

let sites = [];
let markers = {};
let chart = null;
let activeModel = null;
let currentSiteId = null;

const mcg = L.markerClusterGroup({
  chunkedLoading: true,
  maxClusterRadius: 50,
  spiderfyOnMaxZoom: true,
  disableClusteringAtZoom: 15,
  iconCreateFunction: (cluster) => {
    const childCount = cluster.getChildCount();
    let c = "marker-cluster-small";
    if (childCount > 50) c = "marker-cluster-large";
    else if (childCount > 10) c = "marker-cluster-medium";
    return L.divIcon({ html: `<div><span>${childCount}</span></div>`, className: c, iconSize: L.point(40, 40) });
  },
});

function getClassColor(className) {
  return CLASS_COLORS[className] || "#666";
}

function createIcon(className, size = 12) {
  const color = getClassColor(className);
  return L.divIcon({
    html: `<div style="width:${size}px;height:${size}px;background:${color};border-radius:50%;border:2px solid rgba(255,255,255,0.3);box-shadow:0 0 12px ${color}66;"></div>`,
    className: "",
    iconSize: L.point(size + 4, size + 4),
    iconAnchor: [size / 2 + 2, size / 2 + 2],
  });
}

function getFertilityClass(score) {
  if (score >= 0.70) return "High";
  if (score >= 0.50) return "Medium";
  return "Low";
}

function scoreColor(score) {
  return score >= 0.70 ? "#22c55e" : score >= 0.50 ? "#eab308" : "#ef4444";
}

// Load data
fetch("data.json")
  .then(r => r.json())
  .then(data => {
    sites = data.sites;
    MODELS = data.models || [];
    if (MODELS.length > 0) activeModel = MODELS[0];
    
    // Build tabs dynamically
    const tabsContainer = document.getElementById("model-tabs");
    tabsContainer.innerHTML = "";
    MODELS.forEach((model, idx) => {
      const btn = document.createElement("button");
      btn.className = "model-tab" + (idx === 0 ? " active" : "");
      btn.dataset.model = model;
      btn.textContent = model;
      tabsContainer.appendChild(btn);
      
      btn.addEventListener("click", () => {
        document.querySelectorAll(".model-tab").forEach(t => t.classList.remove("active"));
        btn.classList.add("active");
        activeModel = model;
        if (currentSiteId) {
          const site = sites.find(s => s.id === currentSiteId);
          if (site) renderChart(site, activeModel);
        }
      });
    });

    const counts = { Low: 0, Medium: 0, High: 0 };
    sites.forEach(s => {
      counts[s.cc] = (counts[s.cc] || 0) + 1;
      const icon = createIcon(s.cc);
      const marker = L.marker([s.lat, s.lng], { icon });
      marker.siteId = s.id;
      marker.on("click", () => openPanel(s.id));
      mcg.addLayer(marker);
      markers[s.id] = marker;
    });
    map.addLayer(mcg);

    document.getElementById("stat-sites").textContent = sites.length;
    document.getElementById("stat-optimal").textContent = counts.High || 0;
    document.getElementById("stat-moderate").textContent = counts.Medium || 0;
    document.getElementById("stat-low").textContent = counts.Low || 0;
    document.getElementById("count-high").textContent = counts.High || 0;
    document.getElementById("count-med").textContent = counts.Medium || 0;
    document.getElementById("count-low").textContent = counts.Low || 0;

    // Fit bounds
    const bounds = sites.map(s => [s.lat, s.lng]);
    if (bounds.length) map.fitBounds(bounds, { padding: [40, 40] });

    // Open first site as default
    if (sites.length) openPanel(sites[0].id);
  });

// Legend click to filter
document.querySelectorAll("#legend .item").forEach(el => {
  el.addEventListener("click", () => {
    const cls = el.dataset.class;
    const checked = !el.classList.contains("dimmed");
    el.classList.toggle("dimmed");
    el.style.opacity = checked ? "0.4" : "1";
    toggleClass(cls, !checked);
  });
});

function toggleClass(className, show) {
  sites.forEach(s => {
    const m = markers[s.id];
    if (!m) return;
    if (s.cc === className) {
      if (show) mcg.addLayer(m);
      else mcg.removeLayer(m);
    }
  });
}

// Side panel
const panel = document.getElementById("panel");
const backdrop = document.getElementById("panel-backdrop");
const panelClose = document.getElementById("panel-close");

function openPanel(siteId) {
  currentSiteId = siteId;
  const site = sites.find(s => s.id === siteId);
  if (!site) return;

  document.getElementById("panel-title").textContent = "Site " + siteId.split("_").join(" · ");
  document.getElementById("panel-coords").textContent = `${site.lat.toFixed(4)}°N, ${site.lng.toFixed(4)}°E`;

  // Current score
  document.getElementById("panel-current-val").textContent = site.cf.toFixed(3);
  const curBadge = document.getElementById("panel-current-badge");
  curBadge.textContent = site.cc;
  curBadge.className = "badge badge-" + site.cc.toLowerCase();

  // Predicted score (best model)
  updatePrediction(site, activeModel);

  // Chart
  renderChart(site, activeModel);

  panel.classList.add("open");
  backdrop.classList.add("show");
}

function updatePrediction(site, modelName) {
  const forecasts = site.forecast[modelName];
  if (!forecasts || forecasts.length === 0) {
    document.getElementById("panel-predicted-val").textContent = "—";
    document.getElementById("panel-predicted-badge").textContent = "—";
    document.getElementById("panel-predicted-badge").className = "badge";
    return;
  }
  const lastFc = forecasts[forecasts.length - 1].f;
  document.getElementById("panel-predicted-val").textContent = lastFc.toFixed(3);
  const predClass = getFertilityClass(lastFc);
  const predBadge = document.getElementById("panel-predicted-badge");
  predBadge.textContent = predClass;
  predBadge.className = "badge badge-" + predClass.toLowerCase();

  // Trend
  const currentF = site.cf;
  const diff = lastFc - currentF;
  document.getElementById("ps-current").textContent = currentF.toFixed(3);
  document.getElementById("ps-predicted").textContent = lastFc.toFixed(3);
  const trendEl = document.getElementById("ps-trend");
  if (Math.abs(diff) < 0.005) {
    trendEl.textContent = "Stable";
    trendEl.className = "value change-flat";
  } else if (diff > 0) {
    trendEl.textContent = `+${diff.toFixed(3)}`;
    trendEl.className = "value change-up";
  } else {
    trendEl.textContent = `${diff.toFixed(3)}`;
    trendEl.className = "value change-down";
  }
}

function renderChart(site, modelName) {
  const ctx = document.getElementById("trend-chart").getContext("2d");
  if (chart) { chart.destroy(); chart = null; }

  const history = site.history || [];
  const forecasts = site.forecast[modelName] || [];

  // Use last 12 months of history
  const recentHist = history.slice(-12);
  const histDates = recentHist.map(d => d.d);
  const histValues = recentHist.map(d => d.f);
  const histColors = recentHist.map(d => getClassColor(d.c));

  const fcDates = forecasts.map(d => d.d);
  const fcValues = forecasts.map(d => d.f);

  // Combine for labels
  const allLabels = [...histDates, ...fcDates];
  const allValues = [...histValues, ...Array(fcDates.length).fill(null)];

  // Also draw historical continuation
  const lastHistVal = histValues.length > 0 ? histValues[histValues.length - 1] : null;

  // Build a connecting line: last 3 hist + all forecast
  const connectValues = [...histValues.slice(-3), ...fcValues];
  const connectLabels = [...histDates.slice(-3), ...fcDates];

  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: allLabels,
      datasets: [
        {
          label: "Historical",
          data: allValues.map((v, i) => i < histDates.length ? v : null),
          borderColor: "#a78bfa",
          backgroundColor: "rgba(167,139,250,0.1)",
          borderWidth: 2.5,
          pointRadius: (ctx) => {
            const idx = ctx.dataIndex;
            if (idx === histDates.length - 1) return 5;
            return 2.5;
          },
          pointBackgroundColor: (ctx) => {
            const idx = ctx.dataIndex;
            if (idx >= 0 && idx < histColors.length) return histColors[idx];
            return "#a78bfa";
          },
          pointBorderColor: "#fff",
          pointBorderWidth: 1,
          fill: true,
          tension: 0.2,
          spanGaps: false,
        },
        {
          label: "Forecast",
          data: [
            ...Array(histDates.length - 1).fill(null),
            histValues[histValues.length - 1] || null,
            ...fcValues,
          ],
          borderColor: "#22c55e",
          backgroundColor: "rgba(34,197,94,0.08)",
          borderWidth: 2.5,
          borderDash: [6, 4],
          pointRadius: (ctx) => {
            const idx = ctx.dataIndex;
            if (idx >= histDates.length - 1) return 3;
            return 0;
          },
          pointBackgroundColor: "#22c55e",
          pointBorderColor: "#fff",
          pointBorderWidth: 1,
          fill: true,
          tension: 0.2,
          spanGaps: true,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          labels: {
            color: "#9090b0",
            font: { family: "'Inter', sans-serif", size: 11 },
            boxWidth: 14,
            padding: 12,
          },
        },
        tooltip: {
          backgroundColor: "rgba(26,26,36,0.95)",
          titleColor: "#e8e8f0",
          bodyColor: "#e8e8f0",
          borderColor: "#2a2a44",
          borderWidth: 1,
          padding: 10,
          cornerRadius: 8,
          callbacks: {
            label: (ctx) => {
              let label = ctx.dataset.label || "";
              const val = ctx.parsed.y;
              if (val !== null && val !== undefined) {
                label += `: ${val.toFixed(3)}`;
                const cls = getFertilityClass(val);
                label += ` (${cls})`;
              }
              return label;
            },
          },
        },
      },
      scales: {
        x: {
          ticks: { color: "#606080", font: { size: 10 }, maxRotation: 45 },
          grid: { color: "rgba(42,42,68,0.4)" },
        },
        y: {
          min: 0.2,
          max: 0.9,
          ticks: { color: "#606080", font: { size: 10 } },
          grid: { color: "rgba(42,42,68,0.4)" },
        },
      },
    },
  });

  updatePrediction(site, modelName);
}

// Model tabs event listeners are added dynamically during data load

// Panel close
panelClose.addEventListener("click", closePanel);
backdrop.addEventListener("click", closePanel);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePanel(); });

function closePanel() {
